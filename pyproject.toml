[project]
name = "jitterbug"
version = "0.1.0"
description = "Call-quality testing for voice AI agents: scripted calls through emulated bad networks, scored and diagnosed."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "jiwer>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real speech models. Kept optional so tests and CI run without big downloads.
models = [
    "faster-whisper>=1.0",
    "onnxruntime>=1.17",
    "matplotlib>=3.8",
]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
jitterbug = "jitterbug.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jitterbug"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
